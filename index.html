<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oz Yosef Yohay</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
    :root {
        --bg-main: #fcfcfc;
        --bg-content: #fcfcfc;
        --bg-code: #f0f0f0;
        --text-main: #1b1b1b;
        --text-secondary: #555555;
        --text-active: #aa3939;
        --border-color: #e0e0e0;
    }

    body {
        margin: 0;
        font-family: monospace;
        background-color: var(--bg-main);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }
    .header {
        display: flex;
        gap: 20px;
        padding: 10px 15px;
        background-color: none;
        border-bottom: none;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
        font-family: 'Courier New', monospace;
    }
    .header::-webkit-scrollbar {
        display: none;
    }
    .header button {
        background: none;
        border: none;
        font-family: inherit;
        font-size: 16px;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 0;
    }
    .header button.active {
        color: var(--text-active);
    }
    .main-area {
        display: flex;
        flex: 1;
        overflow: hidden;
    }
    .sidebar {
        width: 150px;
        background-color: transparent;
        border-right: none;
        display: flex;
        flex-direction: column;
        padding: 15px 20px;
        gap: 10px;
        overflow-y: auto;
        font-family: 'Courier New', monospace;
    }
    .sidebar button {
        background: none;
        border: none;
        font-family: inherit;
        font-size: 14px;
        color: var(--text-secondary);
        cursor: pointer;
        text-align: left;
        padding: 0;
    }
    .sidebar button.active {
        color: var(--text-active);
    }
    .content-area {
        flex: 1;
        padding: 40px;
        overflow-y: auto;
        background-color: var(--bg-content);
    }
    img {
        max-width: 100%;
        height: auto;
    }
    pre {
        background-color: var(--bg-code);
        padding: 15px;
        overflow-x: auto;
    }
    
    @media (max-width: 768px) {
        .main-area {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            flex-direction: row;
            border-right: none;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 20px;
            box-sizing: border-box;
            scrollbar-width: none;
        }
        .sidebar::-webkit-scrollbar {
            display: none;
        }
        .content-area {
            padding: 20px;
        }
    }
</style>
</head>
<body>

<noscript>
    this system requires javascript to render structurally verified content. please enable javascript or view the raw source files on github.
</noscript>

<div class="header" id="headerNav"></div>
<div class="main-area">
    <div class="sidebar" id="sidebarNav"></div>
    <div class="content-area" id="contentView"></div>
</div>

<script>
    let portfolioData = {};
    let currentCategory = "";
    let currentFile = "";

    // fetches the compiled local json database and initializes the user interface
    async function initApp() {
        try {
            const response = await fetch('data.json');
            portfolioData = await response.json();
            
            const categories = Object.keys(portfolioData);
            if (categories.length > 0) {
                currentCategory = categories[0];
                renderHeader();
                selectCategory(currentCategory);
            } else {
                document.getElementById('contentView').innerHTML = "database is empty";
            }
        } catch (error) {
            document.getElementById('contentView').innerHTML = "failed to load data json. ensure you have executed the python build script.";
        }
    }

    // renders the top navigation buttons dynamically based on available categories
    function renderHeader() {
        const header = document.getElementById('headerNav');
        header.innerHTML = '';
        
        const categories = Object.keys(portfolioData);
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.textContent = cat;
            if (cat === currentCategory) {
                btn.className = 'active';
            }
            btn.onclick = function() {
                selectCategory(cat);
            };
            header.appendChild(btn);
        });
    }

    // handles the state change when a user clicks a different top category
    function selectCategory(category) {
        currentCategory = category;
        renderHeader();
        
        const files = Object.keys(portfolioData[category]);
        if (files.length === 0) {
            currentFile = null;
        } else if (files.includes('README.md')) {
            currentFile = 'README.md';
        } else if (files.includes('missing.txt')) {
            currentFile = 'missing.txt';
        } else {
            currentFile = files[0];
        }
        
        renderSidebar();
        renderContent();
    }

    // renders the vertical sidebar buttons for the currently active category
    function renderSidebar() {
        const sidebar = document.getElementById('sidebarNav');
        sidebar.innerHTML = '';
        
        const files = Object.keys(portfolioData[currentCategory]);
        files.forEach(file => {
            const btn = document.createElement('button');
            btn.textContent = file;
            if (file === currentFile) {
                btn.className = 'active';
            }
            btn.onclick = function() {
                selectFile(file);
            };
            sidebar.appendChild(btn);
        });
    }

    // updates the active file state and forces the main viewing area to refresh
    function selectFile(file) {
        currentFile = file;
        renderSidebar();
        renderContent();
    }

    function renderContent() {
        const view = document.getElementById('contentView');
        if (!currentFile) {
            view.innerHTML = '';
            return;
        }
        
        const content = portfolioData[currentCategory][currentFile];
        
        if (currentFile.endsWith('.pdf')) {
            const viewerurl = 'https://docs.google.com/viewer?url=' + encodeURIComponent(content) + '&embedded=true';
            view.innerHTML = '<iframe src="' + viewerurl + '" width="100%" height="800px" style="border:none;"></iframe>';
        } else if (currentFile.endsWith('.md')) {
            view.innerHTML = marked.parse(content);
        } else if (currentFile.match(/\.(png|jpg|jpeg|gif)$/i)) {
            view.innerHTML = '<img src="' + content + '">';
        } else if (currentFile.endsWith('.html')) {
            view.innerHTML = '<pre><code>' + content.replace(/</g, "&lt;") + '</code></pre>';
        } else {
            // fallback download link only if it is exactly a single web address without newlines
            if (content.startsWith('http') && !content.includes('\n') && !content.includes(' ')) {
                view.innerHTML = '<a href="' + content + '" target="_blank">Download ' + currentFile + '</a>';
            } else {
                view.innerHTML = '<pre>' + content + '</pre>';
            }
        }
        
        if (typeof hljs !== 'undefined') {
            hljs.highlightAll();
        }
    }
    initApp();
</script>
</body>
</html>
