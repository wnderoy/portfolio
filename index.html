<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oz Yosef Yohay</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
    body {
        margin: 0;
        font-family: monospace;
        background-color: #f8f8f8;
        color: #2b2b2b;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }
    .header {
        display: flex;
        gap: 20px;
        padding: 15px 20px;
        background-color: #f8f8f8;
        border-bottom: 1px solid #e0e0e0;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
    }
    .header::-webkit-scrollbar {
        display: none;
    }
    .header button {
        background: none;
        border: none;
        font-family: monospace;
        font-size: 16px;
        color: #555;
        cursor: pointer;
        padding: 0;
    }
    .header button.active {
        color: #000;
    }
    .main-area {
        display: flex;
        flex: 1;
        overflow: hidden;
    }
    .sidebar {
        width: 250px;
        background-color: #f8f8f8;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        padding: 15px 20px;
        gap: 10px;
        overflow-y: auto;
    }
    .sidebar button {
        background: none;
        border: none;
        font-family: monospace;
        font-size: 14px;
        color: #555;
        cursor: pointer;
        text-align: left;
        padding: 0;
    }
    .sidebar button.active {
        color: #000;
    }
    .content-area {
        flex: 1;
        padding: 40px;
        overflow-y: auto;
        background-color: #fcfcfc;
    }
    img {
        max-width: 100%;
        height: auto;
    }
    pre {
        background-color: #f0f0f0;
        padding: 15px;
        overflow-x: auto;
    }
    
    @media (max-width: 768px) {
        .main-area {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            flex-direction: row;
            border-right: none;
            border-bottom: 1px solid #e0e0e0;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 20px;
            box-sizing: border-box;
            scrollbar-width: none;
        }
        .sidebar::-webkit-scrollbar {
            display: none;
        }
        .content-area {
            padding: 20px;
        }
    }
</style>
</head>
<body>

<div class="header" id="headerNav"></div>
<div class="main-area">
    <div class="sidebar" id="sidebarNav"></div>
    <div class="content-area" id="contentView"></div>
</div>

<script>
    const portfolioData = {
        "Oz Yosef Yohay": {
            "README.md": "![Logo](https://picsum.photos/800/200?grayscale)\n\n# oz yosef yohay\n\nsystems engineer and software developer.\n\n## contact\n\nemail: demo@example.com\n\nlocation: israel"
        },
        "VERIFIED*": {
            "README.md": "![Verified](https://picsum.photos/800/200?grayscale&random=1)\n\n# formal verification projects\n\nthis section contains proofs and mathematically verified software models.",
            "proof.dfy": "method Abs(x: int) returns (y: int)\n  ensures 0 <= y\n  ensures 0 <= x ==> y == x\n  ensures x < 0 ==> y == -x\n{\n  if x < 0 {\n    return -x;\n  } else {\n    return x;\n  }\n}"
        },
        "C++": {
            "README.md": "![Cpp](https://picsum.photos/800/200?grayscale&random=2)\n\n# c plus plus systems\n\nrugged architecture and memory management examples.",
            "main.cpp": "#include <iostream>\n\nint main() {\n    std::cout << \"system initialized\" << std::endl;\n    return 0;\n}"
        },
        "PHARMGURD": {
            "README.md": "![Pharm](https://picsum.photos/800/200?grayscale&random=3)\n\n# pharmgurd nfc project\n\nsmart medication tracking system documentation.",
            "architecture.txt": "utilizing nfc tags for supply chain verification and dosage adherence."
        },
        "HOMEWORK": {
            "README.md": "![Homework](https://picsum.photos/800/200?grayscale&random=4)\n\n# academic assignments\n\nselected algorithms and data structures.",
            "math.txt": "teaching materials for advanced student groups."
        }
    };

    let currentCategory = "Oz Yosef Yohay";
    let currentFile = "README.md";

    // initializes the application and renders the initial state
    function initApp() {
        renderHeader();
        selectCategory(currentCategory);
    }

    // builds the top navigation bar with category names
    function renderHeader() {
        const header = document.getElementById('headerNav');
        header.innerHTML = '';
        
        const categories = Object.keys(portfolioData);
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.textContent = cat;
            if (cat === currentCategory) {
                btn.className = 'active';
            }
            btn.onclick = function() {
                selectCategory(cat);
            };
            header.appendChild(btn);
        });
    }

    // handles category selection and updates the user interface
    function selectCategory(category) {
        currentCategory = category;
        renderHeader();
        
        const files = Object.keys(portfolioData[category]);
        if (files.length === 0) {
            currentFile = null;
        } else if (files.includes('README.md')) {
            currentFile = 'README.md';
        } else {
            currentFile = files[0];
        }
        
        renderSidebar();
        renderContent();
    }

    // builds the file list sidebar for the active category
    function renderSidebar() {
        const sidebar = document.getElementById('sidebarNav');
        sidebar.innerHTML = '';
        
        const files = Object.keys(portfolioData[currentCategory]);
        files.forEach(file => {
            const btn = document.createElement('button');
            btn.textContent = file;
            if (file === currentFile) {
                btn.className = 'active';
            }
            btn.onclick = function() {
                selectFile(file);
            };
            sidebar.appendChild(btn);
        });
    }

    // handles file selection and updates the main view
    function selectFile(file) {
        currentFile = file;
        renderSidebar();
        renderContent();
    }

    // parses markdown or code and injects it into the viewing area
    function renderContent() {
        const view = document.getElementById('contentView');
        if (!currentFile) {
            view.innerHTML = '';
            return;
        }
        
        const content = portfolioData[currentCategory][currentFile];
        
        if (currentFile.endsWith('.md')) {
            view.innerHTML = marked.parse(content);
        } else if (currentFile.endsWith('.txt')) {
            view.innerHTML = '<pre>' + content + '</pre>';
        } else {
            const extension = currentFile.split('.').pop();
            const formatted = '<pre><code class="language-' + extension + '">' + content + '</code></pre>';
            view.innerHTML = formatted;
        }
        
        hljs.highlightAll();
    }

    initApp();
</script>
</body>
</html>
